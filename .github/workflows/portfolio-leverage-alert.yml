name: portfolio-leverage-alert

on:
  schedule:
    # 매일 20:30 UTC = 05:30 KST (미국 나스닥 정규장 마감 이후)
    - cron: "30 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-drawdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r portfolio-leverage-alert/requirements.txt

      - name: Run drawdown check
        run: python portfolio-leverage-alert/check_drawdown.py

      - name: Commit state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio-leverage-alert/state.json
          git diff --cached --quiet || git commit -m "update nasdaq100 drawdown state"
          git push
